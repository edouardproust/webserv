<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>404 Not Found - webserv</title>
	<link rel="stylesheet" href="style/main.css">
</head>
<body>
	<div class="header">
		<img src="webserv.png" alt="webserv" width="80">
		<h1>webserv</h1>
	</div>

	<div class="error-container">
		<div class="emoji">😞</div>
		<div class="error-code">404</div>
		<h1 class="error-title">Page Not Found</h1>

		<p class="error-message">
			The page you're looking for doesn't exist or has been moved.
			Check the URL for typos or go back to the home page.
		</p>

		<div class="error-path">
			Requested path: <strong id="requested-path">/</strong>
		</div>

		<a href="/" class="home-button">Go Back Home</a>
	</div>

	<script>
		const path = window.location.pathname;
		document.getElementById('requested-path').textContent = path;
	</script>
</body>
</html>
